version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: nearbyneeds-mysql
    environment:
      MYSQL_DATABASE: nearbyneeds
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: nearbyneeds-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: nearbyneeds-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/nearbyneeds?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - JWT_SECRET=9a4f2c8d3b7a1e6f45c8a0b3f267d8b1d4e6f3c8a9d2b5f8e3a9c8b5f6v8a3d9
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      - mysql
      - redis
    restart: unless-stopped

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: nearbyneeds-frontend
    ports:
      - "80:80"
    environment:
      - BACKEND_URL=http://backend:8080
      - NGINX_ENVSUBST_VARS=BACKEND_URL
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mysql_data:
  backend_uploads:
