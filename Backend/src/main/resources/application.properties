spring.application.name=nearbyneeds

# Server Configuration
server.port=${PORT:8080}

# Database Configuration with Environment Variables and Fallbacks
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:nearbyneeds}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${MYSQLUSER:root}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${MYSQLPASSWORD:Vrushabh@2882005}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.spatial.dialect.mysql.MySQLSpatialDialect

# Redis Configuration
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:${REDISHOST:localhost}}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:${REDISPORT:6379}}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:${REDISPASSWORD:}}

# JWT Secret Configuration
jwt.secret=${JWT_SECRET:9a4f2c8d3b7a1e6f45c8a0b3f267d8b1d4e6f3c8a9d2b5f8e3a9c8b5f6v8a3d9}
jwt.expiration=${JWT_EXPIRATION:86400000}

